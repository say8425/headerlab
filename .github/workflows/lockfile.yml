name: Lockfile

# Temporary. `pnpm import` run where the whole registry is visible, because this
# office's proxy cannot see the pinned versions of some optional platform
# bindings and drops them in silence. Delete once its artifact is committed.
on:
  push:
    branches: [ci-split-pnpm-release-please]

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - run: corepack enable

      # From the last commit that had it, so every version is the one npm had
      # already resolved — this converts, it does not re-resolve.
      - name: Restore package-lock.json
        run: git show 2b742826e497e82ec2b7042cf85be126fa73a2fd:package-lock.json > package-lock.json

      - run: rm -f pnpm-lock.yaml && pnpm import

      - name: Report the binding counts
        run: |
          for tool in oxfmt oxlint; do
            echo "$tool: $(grep -c "'@$tool/binding-" pnpm-lock.yaml) lines"
            grep -o "'@$tool/binding-[a-z0-9-]*@[0-9.]*'" pnpm-lock.yaml | sort -u | wc -l
          done

      - uses: actions/upload-artifact@v7
        with:
          name: pnpm-lock
          path: pnpm-lock.yaml
          retention-days: 1
