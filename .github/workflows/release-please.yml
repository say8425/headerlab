name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  # npm's provenance attestation is signed with the workflow's OIDC token, so
  # the package page can show which commit and which workflow produced the
  # tarball. For an extension that exists because a hidden tracker was found in
  # its predecessor, that is worth one permission.
  id-token: write

concurrency:
  group: ${{ github.workflow }}

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      extension_released: ${{ steps.release.outputs.release_created }}
      extension_tag: ${{ steps.release.outputs.tag_name }}
      extension_version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # Everything that can fail runs BEFORE the tag exists.
      #
      # release-please cuts the tag and creates the GitHub release inside its own
      # step, and neither is undoable — this repository has twice gone red after
      # that point (EOTP on publish, then EUSAGE on provenance) with the
      # irreversible half already done. So `check` and `zip` are unconditional
      # and above it: on an ordinary push they cost a build this workflow was
      # going to need anyway, and on a release they are the difference between a
      # red push and a tagged version nobody can withdraw.
      #
      # Unconditional also removes a guess. Whether this push releases is not
      # known until the action below has run, so gating the checks on its output
      # can only ever put them after it.
      #
      # This duplicates `ci.yml`, which also runs on push to main. That is not an
      # accident and not free: the two workflows start together and neither waits
      # for the other, so `ci.yml` passing is never a fact this job can act on.
      - run: pnpm check

      # `wxt zip` builds first, so there is no separate build step. The version in
      # the file name comes from package.json, which the release PR has already
      # bumped by the time that PR's merge lands here.
      - run: pnpm zip

      # SHA-pinned, unlike the GitHub-published actions elsewhere: this is the
      # one third-party action here and the only job that holds write scopes.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release

      - name: Attach the unpacked-loadable build to the release
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh release upload "$TAG" .output/*.zip

      # Gated on the CLI's own prefixed output, not the bare `release_created`
      # the step above uses — that one only exists for the root component
      # (path `.`, the extension). release-please-action prefixes every output
      # with the package path once that path isn't `.`, so the CLI's is
      # `packages/headerlab--release_created` (accessed with bracket syntax
      # because the key contains `/`). Getting this wrong fails in two different
      # directions: the bare form skips this step on a CLI-only release (tagged,
      # released, nothing published), or fires it on an extension-only release
      # and publishes the CLI unchanged at whatever version its package.json
      # already holds — claiming that version on npm permanently, since the
      # unpublish window is 72 hours.
      - uses: actions/setup-node@v6
        if: ${{ steps.release.outputs['packages/headerlab--release_created'] }}
        with:
          # Still required under trusted publishing — npm's own documented
          # workflow keeps it. It is what points the publish at the registry
          # the trusted publisher is configured on.
          registry-url: https://registry.npmjs.org

      # `npm`, not `pnpm`: pnpm is broken on the developer's machine (CLAUDE.md)
      # and publishing only ever happens here, where npm ships with the Node
      # setup-node just installed. `.nvmrc` pins 24, whose npm is 11.13.0 —
      # trusted publishing needs npm 11.5.1 and Node 22.14.0 at minimum.
      #
      # **No token.** Authentication is OIDC against the trusted publisher
      # configured on the package (this repository, this workflow file), which
      # is why the job holds `id-token: write`. `NODE_AUTH_TOKEN` and the
      # `NPM_TOKEN` secret behind it are gone: npm is retiring the tokens that
      # publish without a one-time password — account operations already, and
      # direct publishing around January 2027 — and this repository met that
      # wall twice, with `EOTP` after the tag and GitHub release had already
      # been created. Trusted publishing removes the credential rather than
      # renewing it.
      #
      # `--provenance` is redundant here and kept deliberately. npm attaches
      # provenance automatically when publishing through a trusted publisher,
      # so the flag changes nothing while the configuration is intact — and
      # fails the job loudly if it ever is not. The package's own README tells
      # readers that every release published from CI carries an attestation
      # and to check with `npm audit signatures`; silently shipping an
      # unsigned tarball under that promise is the failure this keeps loud.
      #
      # `--access public` is gone with the token. It was required by
      # `--provenance` on a package that did not yet exist — npm cannot infer
      # publicity for one and refuses to sign it. `headerlab` exists and is
      # public now, so a publish inherits that.
      - run: npm publish --provenance
        if: ${{ steps.release.outputs['packages/headerlab--release_created'] }}
        working-directory: packages/headerlab

  # The store submission cannot be its own workflow triggered by the release.
  # release-please creates that release with the default GITHUB_TOKEN, and
  # GitHub's loop-prevention rule means such an event starts no workflow run —
  # `release` and `push` are not among the exceptions. So it is a job in this
  # run, and `store-submit.yml` is reusable rather than event-triggered.
  #
  # `workflow_call` also keeps GITHUB_REF at `refs/heads/main`, which is what the
  # `chrome-web-store` environment's deployment branch rule names. A tag rule
  # there would match nothing while reading as strict.
  store-submit:
    needs: release-please
    if: ${{ needs.release-please.outputs.extension_released }}
    uses: ./.github/workflows/store-submit.yml
    with:
      tag: ${{ needs.release-please.outputs.extension_tag }}
      version: ${{ needs.release-please.outputs.extension_version }}
    secrets: inherit
