name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  # npm's provenance attestation is signed with the workflow's OIDC token, so
  # the package page can show which commit and which workflow produced the
  # tarball. For an extension that exists because a hidden tracker was found in
  # its predecessor, that is worth one permission.
  id-token: write

concurrency:
  group: ${{ github.workflow }}

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # First and unconditional, though release-please itself works off the API
      # and needs no worktree: `./.github/actions/setup` below is a *local*
      # action, and a local action with no checkout is the "Can't find
      # action.yml" failure. Making it depend on a conditional step to have run
      # is a way to discover that on a release rather than on a push.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # SHA-pinned, unlike the GitHub-published actions elsewhere: this is the
      # one third-party action here and the only job that holds write scopes.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release

      # `releases_created` (plural), not `release_created`: the unprefixed
      # singular output only exists for the root component (path `.`, the
      # extension) — see the path-outputs comment further down. This repo
      # runs `separate-pull-requests: true`, so a CLI-only change produces a
      # CLI-only release PR with the root output unset; gating setup on the
      # singular would skip it, and skip the check below with it.
      - uses: ./.github/actions/setup
        if: ${{ steps.release.outputs.releases_created }}

      # The release PR is opened with the default GITHUB_TOKEN, which by
      # GitHub's own loop-prevention rule does not trigger `ci.yml` — so the
      # commit being released is the one commit that reaches `main`
      # unchecked, extension or CLI alike. Same `releases_created` gate as
      # setup above, and for the same reason: a CLI-only release must not
      # skip this just because the root component didn't release.
      - run: pnpm check
        if: ${{ steps.release.outputs.releases_created }}

      # `wxt zip` builds first, so there is no separate build step.
      - run: pnpm zip
        if: ${{ steps.release.outputs.release_created }}

      - name: Attach the unpacked-loadable build to the release
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh release upload "$TAG" .output/*.zip

      # Gated on the CLI's own prefixed output, not the bare `release_created`
      # the two steps above use — that one only exists for the root
      # component (path `.`, the extension). release-please-action prefixes
      # every output with the package path once that path isn't `.`, so the
      # CLI's is `packages/headerlab--release_created` (accessed with
      # bracket syntax because the key contains `/`). Getting this wrong
      # fails in two different directions: the bare form skips this step on
      # a CLI-only release (tagged, released, nothing published), or fires it
      # on an extension-only release and publishes the CLI unchanged at
      # whatever version its package.json already holds — claiming that
      # version on npm permanently, since the unpublish window is 72 hours.
      - uses: actions/setup-node@v6
        if: ${{ steps.release.outputs['packages/headerlab--release_created'] }}
        with:
          # Still required under trusted publishing — npm's own documented
          # workflow keeps it. It is what points the publish at the registry
          # the trusted publisher is configured on.
          registry-url: https://registry.npmjs.org

      # `npm`, not `pnpm`: pnpm is broken on the developer's machine (CLAUDE.md)
      # and publishing only ever happens here, where npm ships with the Node
      # setup-node just installed. `.nvmrc` pins 24, whose npm is 11.13.0 —
      # trusted publishing needs npm 11.5.1 and Node 22.14.0 at minimum.
      #
      # **No token.** Authentication is OIDC against the trusted publisher
      # configured on the package (this repository, this workflow file), which
      # is why the job holds `id-token: write`. `NODE_AUTH_TOKEN` and the
      # `NPM_TOKEN` secret behind it are gone: npm is retiring the tokens that
      # publish without a one-time password — account operations already, and
      # direct publishing around January 2027 — and this repository met that
      # wall twice, with `EOTP` after the tag and GitHub release had already
      # been created. Trusted publishing removes the credential rather than
      # renewing it.
      #
      # `--provenance` is redundant here and kept deliberately. npm attaches
      # provenance automatically when publishing through a trusted publisher,
      # so the flag changes nothing while the configuration is intact — and
      # fails the job loudly if it ever is not. The package's own README tells
      # readers that every release published from CI carries an attestation
      # and to check with `npm audit signatures`; silently shipping an
      # unsigned tarball under that promise is the failure this keeps loud.
      #
      # `--access public` is gone with the token. It was required by
      # `--provenance` on a package that did not yet exist — npm cannot infer
      # publicity for one and refuses to sign it. `headerlab` exists and is
      # public now, so a publish inherits that.
      - run: npm publish --provenance
        if: ${{ steps.release.outputs['packages/headerlab--release_created'] }}
        working-directory: packages/headerlab
