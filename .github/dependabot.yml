# ci.yml uses floating majors, so patches and minors arrive on their own — this
# is here for the major bumps, which are breaking and want a human. npm is
# deliberately off: this repo's lockfile cannot be regenerated here (CLAUDE.md,
# "A local `npm install` will corrupt the lockfile").
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
